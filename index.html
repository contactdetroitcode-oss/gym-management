<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Pro - Connexion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo">
                <div class="logo-circle">G</div>
                <h1>GYM PRO</h1>
                <p>Management System</p>
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@gympro.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Votre mot de passe"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="login-error"
                ></div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Se connecter
                </button>

            </form>


            <div class="login-help">

                <strong>
                    Compte administrateur
                </strong>

                <span>
                    admin@gympro.com
                </span>

                <span>
                    Mot de passe : admin123
                </span>

            </div>

        </div>

    </div>


    <script src="js.js"></script>

</body>

</html>
